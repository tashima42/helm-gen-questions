name: Release

# Pushing a X.Y.Z tag builds the binaries for all the platforms, packages them as a
# Helm plugin and publishes a GitHub release with the tarball and its checksum.

on:
  push:
    tags: ["*"]

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    container: ghcr.io/rancher/ci-image/charts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Test
        run: make test
      - name: package
        run: make package
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --generate-notes \
            "dist/questions-${VERSION}.tgz" \
            dist/checksums.txt
